version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: dms_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-distribution_db}"
      POSTGRES_USER: "${POSTGRES_USER:-dms_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required in production}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms_user} -d ${POSTGRES_DB:-distribution_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dms_redis_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms_backend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: v1
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-distribution_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_OR_KEY: "${JWT_SECRET_OR_KEY:?Error: JWT_SECRET_OR_KEY is required in production}"
      BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:?Error: BACKUP_ENCRYPTION_KEY is required in production}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://admin.domain.com,https://owner.domain.com}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage_data_prod:/app/storage
      - backup_data_prod:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_prod:
  redis_data_prod:
  storage_data_prod:
  backup_data_prod:

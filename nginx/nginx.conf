# ==============================================================================
# Nginx Reverse Proxy & Security Hardening Configuration for DMS
# ==============================================================================

server {
    listen 80;
    server_name api.domain.com;

    # Enforce HTTP to HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.domain.com;

    # Cloudflare / Origin SSL Certificate
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:;" always;

    # Capped Request Payload Size (10 MB max for multipart file upload)
    client_max_body_size 10M;

    # SECURITY INVARIANT: Explicitly block direct public access to private POD storage
    location /storage {
        deny all;
        return 403;
    }

    location /app/storage {
        deny all;
        return 403;
    }

    # REST API Proxy
    location /v1/ {
        proxy_pass http://backend:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Realtime Gateway Proxy (/v1/realtime)
    location /v1/realtime/ {
        proxy_pass http://backend:3000/v1/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

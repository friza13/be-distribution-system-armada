openapi: 3.0.3
info:
  title: Distribution Management System (DMS) API
  description: OpenAPI 3.0 specification for Armada Capstone DMS Backend API.
  version: 2.0.0
servers:
  - url: /v1
    description: Production API v1

paths:
  /health/liveness:
    get:
      summary: Liveness probe check
      description: Returns process uptime and liveness status.
      responses:
        '200':
          description: Process is live

  /health/readiness:
    get:
      summary: Readiness probe check
      description: Deep check evaluating DB, Redis, and Storage readiness.
      responses:
        '200':
          description: System is healthy and ready to serve traffic
        '503':
          description: System component is unhealthy

  /me/location:
    post:
      summary: Ingest single GPS telemetry data point
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Location ingested
        '429':
          description: Rate limit exceeded

  /devices/register-push-token:
    post:
      summary: Register FCM push notification token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Push token registered

  /notifications:
    get:
      summary: Get user operational notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications list

  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notification marked read

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
